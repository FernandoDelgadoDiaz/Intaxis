name: Agentic Pymes chat transport smoke

on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/chat-transport.js'
      - 'src/routes/chat.js'
      - 'src/web.js'
      - '.github/workflows/chat-query-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Director mission transport
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('src/app.js','utf8'); const transport=fs.readFileSync('src/chat-transport.js','utf8'); if(!app.includes(\"req.get('x-agentic-mission')\")) process.exit(1); if(!app.includes('decodeURIComponent(encodedHeader)')) process.exit(1); if(!app.includes('0.3.4-chat-header')) process.exit(1); if(!transport.includes(\"headers.set('X-Agentic-Mission', encodeURIComponent(mission))\")) process.exit(1); if(!transport.includes('mensaje=${encodeURIComponent(mission)}')) process.exit(1);"
