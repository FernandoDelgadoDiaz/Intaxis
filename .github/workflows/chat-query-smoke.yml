name: Agentic Pymes chat transport smoke

on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/chat-transport.js'
      - 'src/routes/chat.js'
      - 'src/web.js'
      - '.github/workflows/chat-query-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Director mission transport
        run: |
          grep -F "req.get('x-agentic-mission')" src/app.js
          grep -F "decodeURIComponent(encodedHeader)" src/app.js
          grep -F "export const BUILD_VERSION" src/app.js
          grep -F "headers.set('X-Agentic-Mission', encodeURIComponent(mission))" src/chat-transport.js
          grep -F 'mensaje=${encodeURIComponent(mission)}' src/chat-transport.js
          node --check src/app.js
          node --check src/chat-transport.js
