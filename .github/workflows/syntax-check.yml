name: Agentic Pymes syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/real-specialist-agents]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: npm run check
